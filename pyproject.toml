[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spamoji"
version = "0.1.0"
description = "A programming language that only uses emojis as syntax."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "phorb" }]
dependencies = []

[project.scripts]
spamoji = "spamoji.spamoji:main"

[tool.setuptools]
packages = ["spamoji"]
