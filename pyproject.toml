[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spamoji"
dynamic = ["version"]
description = "A programming language that only uses emojis as syntax."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "iqnite" }]
dependencies = []

[project.urls]
Repository = "https://github.com/iqnite/spamoji"

[project.scripts]
spamoji = "spamoji.spamoji:main"

[tool.setuptools]
packages = ["spamoji"]

[tool.setuptools.dynamic]
version = { attr = "spamoji.metadata.__version__" }
